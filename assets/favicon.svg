<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Impact Connect">
  <!-- Het merkteken van Impact Connect: de Vollers Bridge, een dekbalk met
     daaronder een boog op twee pijlers. Dit is niet dezelfde tekening als
     bridgeMark() in script.js, maar een zwaardere versie ervan.

     Reden: die van de site is 124 breed en heeft een dekbalk van 8 dik, dus
     1/15 van de breedte. In een browsertabblad is het icoontje 16 pixels; de
     balk zou dan een pixel breed worden en de boog nog dunner. Vandaar hier
     dikkere lijnen en geen middenstukje: bij dit formaat overleeft alleen de
     silhouet. Verander je het logo, verander dan allebei. -->
  <rect width="64" height="64" rx="14" fill="#2B6B4F"/>
  <g fill="#F4EFE3">
    <rect x="12" y="16" width="40" height="6"/>
    <path d="M12 48 A20 20 0 0 1 52 48 L46 48 A14 14 0 0 0 18 48 Z"/>
    <rect x="12" y="40" width="6" height="8"/>
    <rect x="46" y="40" width="6" height="8"/>
  </g>
</svg>
